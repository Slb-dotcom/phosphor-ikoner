<!doctype html>
<html lang="da">

<title>Kvadrant-genveje</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root { --ink: #262139; --text: #27272C; --muted: #6E6C80; --line: #E0E3EC; --bg: #F4F5F8; --yellow: #EDF505; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 12px/1.3 Inter, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--ink); color: #fff; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
  header b { letter-spacing: .14em; font-size: 12px; }
  header span { color: #B9B6CC; font-size: 11.5px; margin-left: auto; }
  header .logo { height: 15px; width: auto; display: block; }
  main { flex: 1; overflow-y: auto; padding: 8px 10px 10px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 10px; align-content: start; font-size: 11.5px; }
  @media (max-width: 760px) { main { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  h2 { margin: 0 0 3px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  button { all: unset; display: flex; align-items: center; gap: 6px; width: 100%; padding: 1px 3px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button:hover, button.flash { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  button.flash kbd { background: var(--yellow); }
  kbd { flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; background: #fff; box-shadow: inset 0 0 0 1px var(--line), 0 1px 0 var(--line);
        display: inline-grid; place-items: center; font: 600 11px Inter, "Segoe UI", sans-serif; color: var(--ink); }
</style>
</head>

</header>
<main id="keys"></main>
<script>
// Tast -> kommando i panelets runtime. keep: baren bliver åben, så tasten kan trykkes flere gange.
const GROUPS = [
  ["Juster", [["L", "Venstre", "alignLeft"], ["C", "Centrér vandret", "alignCenter"], ["R", "Højre", "alignRight"],
              ["T", "Top", "alignTop"], ["M", "Centrér lodret", "alignMiddle"], ["B", "Bund", "alignBottom"], ["O", "Midt på sliden", "centerOnSlide"]]],
  ["Afstand", [["→", "Øg vandret", "spaceHMore", 1], ["←", "Mindsk vandret", "spaceHLess", 1], ["↓", "Øg lodret", "spaceVMore", 1],
               ["↑", "Mindsk lodret", "spaceVLess", 1], ["H", "Fordel vandret", "distributeH"], ["V", "Fordel lodret", "distributeV"], ["N", "Gitter", "gridAuto"]]],
  ["Form", [["S", "Samme størrelse", "sameSize"], ["W", "Samme bredde", "sameWidth"], ["E", "Samme højde", "sameHeight"],
            ["X", "Byt plads", "swapShapes"], ["P", "Kopiér skrift", "copyType"], ["D", "Kopiér form", "copyShape"], ["F", "Forrest", "bringToFront"], ["G", "Bagest", "sendToBack"]]],
  ["Tekst", [["+", "Større tekst", "fontBigger", 1], ["-", "Mindre tekst", "fontSmaller", 1]]],
  ["Indsæt", [["I", "Ikonpanel", "showPane"], ["A", "Agenda", "openAgenda"], ["U", "Udkast-stempel", "stampDraft"],
              ["Z", "Fortroligt-stempel", "stampConfidential"], ["J", "Kilde", "stampSource"], ["Y", "Bibliotek", "openLibrary"], ["K", "Kvadrant-tjek", "openCheck"]]],
  ["Harvey balls", [["Q", "Vælg procent …", "openHarvey"], ["0", "0 %", "harvey0"], ["1", "25 %", "harvey25"], ["2", "50 %", "harvey50"], ["3", "75 %", "harvey75"], ["4", "100 %", "harvey100"]]],
];
const KEYS = { ArrowRight: "→", ArrowLeft: "←", ArrowDown: "↓", ArrowUp: "↑", "_": "-", "?": "+" };
const byKey = {};
document.getElementById("keys").innerHTML = GROUPS.map(([title, items]) => `<section><h2>${title}</h2>${items.map(([k, label, cmd, keep]) => {
  byKey[k] = { cmd, keep: !!keep };
  return `<button data-k="${k}"><kbd>${k}</kbd>${label}</button>`;
}).join("")}</section>`).join("");

let ready = false;
const send = (msg) => { if (ready) Office.context.ui.messageParent(JSON.stringify(msg)); };
function fire(k) {
  const hit = byKey[k];
  if (!hit) return;
  const b = document.querySelector(`button[data-k="${CSS.escape(k)}"]`);
  b?.classList.add("flash");
  setTimeout(() => b?.classList.remove("flash"), 150);
  send(hit);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { send({ close: true }); return; }
  if (e.ctrlKey && e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") { send({ close: true }); return; }   // Ctrl+Shift+K igen lukker
  const k = KEYS[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : null);
  if (k && byKey[k]) { e.preventDefault(); fire(k); }
});
document.getElementById("keys").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) fire(b.dataset.k); });
Office.onReady(() => { ready = true; window.focus(); });
</script>
