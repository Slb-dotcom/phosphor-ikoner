<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphor-ikoner</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --ink: #3C2C1C;
    --muted: #8C7D6D;
    --line: #EAE2D7;
    --accent: #B8862E;
    --accent-soft: #F5ECDC;
    --dark-cell: #2A221B;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(60, 44, 28, .06), 0 6px 20px rgba(60, 44, 28, .08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Top: search + controls ---------- */
  .top { padding: 14px 14px 10px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .search { position: relative; }
  .search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 38px; padding: 0 34px 0 34px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    font: inherit; font-size: 14px; color: var(--ink); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: #B3A796; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search .clear {
    position: absolute; right: 6px; top: 50%; translate: 0 -50%;
    width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--muted);
    display: none; place-items: center;
  }
  .search .clear:hover { background: var(--accent-soft); color: var(--ink); }
  .search.has-text .clear { display: grid; }

  .label { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }

  .weights {
    display: grid; grid-template-columns: repeat(6, 1fr);
    background: #F1EBE2; border-radius: var(--radius); padding: 3px; gap: 2px;
  }
  .weights button {
    border: 0; background: transparent; border-radius: 7px; padding: 6px 0 5px;
    display: grid; justify-items: center; gap: 2px; font-size: 10.5px; color: var(--muted);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .weights button svg { width: 20px; height: 20px; }
  .weights button:hover { color: var(--ink); }
  .weights button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(60,44,28,.15); }

  .colors { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); position: relative;
    transition: transform .12s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-pressed="true"]::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent);
  }
  .swatch.custom { background: conic-gradient(#e64, #ec4, #5c6, #4ad, #86e, #e5a, #e64); }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .hex {
    margin-left: auto; display: flex; align-items: center; height: 28px; width: 92px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding-left: 8px; color: var(--muted);
  }
  .hex input { width: 100%; border: 0; outline: 0; background: transparent; font: 12.5px ui-monospace, Consolas, monospace; color: var(--ink); text-transform: uppercase; padding-left: 2px; }
  .hex:focus-within { border-color: var(--accent); }

  /* ---------- Grid ---------- */
  .scroll { flex: 1; overflow-y: auto; padding: 10px 14px 16px; scrollbar-width: thin; }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 8px; }
  .section-title .count { font-size: 11.5px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
  .grid + .section-title { margin-top: 16px; }
  .cell {
    aspect-ratio: 1; border: 0; border-radius: 9px; background: var(--surface);
    display: grid; place-items: center; color: var(--icon-color);
    box-shadow: inset 0 0 0 1px var(--line);
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .cell svg { width: 28px; height: 28px; }
  .cell:hover { transform: translateY(-1px); box-shadow: inset 0 0 0 1px var(--accent), var(--shadow); }
  .cell.selected { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  body.light-icons .cell { background: var(--dark-cell); box-shadow: none; }
  body.light-icons .cell.selected { box-shadow: inset 0 0 0 2px var(--accent); }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 8px; }
  .skeleton .cell { background: linear-gradient(90deg, #F1EBE2 25%, #F8F3EC 50%, #F1EBE2 75%); background-size: 300% 100%; animation: shimmer 1.2s infinite; box-shadow: none; }
  @keyframes shimmer { to { background-position: -150% 0; } }

  /* ---------- Bottom: selected icon ---------- */
  .detail {
    border-top: 1px solid var(--line); background: var(--surface); padding: 12px 14px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  }
  .preview {
    width: 60px; height: 60px; border-radius: 12px; display: grid; place-items: center;
    background: var(--bg); color: var(--icon-color); box-shadow: inset 0 0 0 1px var(--line);
  }
  body.light-icons .preview { background: var(--dark-cell); }
  .preview svg { width: 40px; height: 40px; }
  .meta { min-width: 0; }
  .meta .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .size { display: inline-flex; align-items: center; gap: 2px; margin-top: 6px; border: 1px solid var(--line); border-radius: 7px; height: 26px; }
  .size button { width: 24px; height: 24px; border: 0; background: transparent; border-radius: 6px; color: var(--muted); }
  .size button:hover { background: var(--accent-soft); color: var(--ink); }
  .size input { width: 34px; border: 0; outline: 0; text-align: center; font: inherit; font-size: 12.5px; color: var(--ink); background: transparent; }
  .size span { font-size: 11.5px; color: var(--muted); padding-right: 6px; }
  .insert {
    height: 38px; padding: 0 16px; border: 0; border-radius: var(--radius);
    background: var(--ink); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, transform .1s;
  }
  .insert svg { width: 16px; height: 16px; }
  .insert:hover { background: #2A1F14; }
  .insert:active { transform: scale(.97); }
  .insert:disabled { opacity: .4; cursor: default; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; translate: -50% 12px; opacity: 0;
    background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 12.5px;
    box-shadow: var(--shadow); pointer-events: none; transition: opacity .2s, translate .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; translate: -50% 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <div class="top">
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
      <input id="search" type="text" placeholder="Søg – fx pil, graf, user, money" autocomplete="off" spellcheck="false">
      <button class="clear" id="clear" title="Ryd søgning" aria-label="Ryd søgning">
        <svg viewBox="0 0 256 256" fill="currentColor" style="position:static;translate:none;width:14px;height:14px"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
      </button>
    </div>
    <div>
      <div class="label">Tykkelse</div>
      <div class="weights" id="weights" role="group" aria-label="Tykkelse"></div>
    </div>
    <div>
      <div class="label">Farve</div>
      <div class="colors" id="colors">
        <label class="swatch custom" title="Vælg egen farve"><input type="color" id="picker" aria-label="Vælg egen farve"></label>
        <label class="hex">#<input id="hex" maxlength="6" spellcheck="false" aria-label="Hex-farve"></label>
      </div>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div id="recentWrap" hidden>
      <div class="section-title"><span class="label" style="margin:0">Senest brugt</span></div>
      <div class="grid" id="recent"></div>
    </div>
    <div class="section-title"><span class="label" style="margin:0" id="gridTitle">Alle ikoner</span><span class="count" id="count"></span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <div class="detail">
    <div class="preview" id="preview"></div>
    <div class="meta">
      <div class="name" id="selName">Vælg et ikon</div>
      <div class="sub" id="selSub">Dobbeltklik for at indsætte med det samme</div>
      <div class="size" title="Størrelse på sliden">
        <button id="sizeDown" aria-label="Mindre">−</button>
        <input id="size" inputmode="decimal" aria-label="Størrelse i cm">
        <span>cm</span>
        <button id="sizeUp" aria-label="Større">+</button>
      </div>
    </div>
    <button class="insert" id="insert" disabled>
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>
      Indsæt
    </button>
  </div>

  <div class="toast" id="toast"></div>

<script>
const WEIGHTS = ["thin", "light", "regular", "bold", "fill", "duotone"];
const WEIGHT_LABELS = { thin: "Thin", light: "Light", regular: "Regular", bold: "Bold", fill: "Fill", duotone: "Duo" };
const SWATCHES = [
  { hex: "3C2C1C", name: "Mørkebrun" },
  { hex: "B8862E", name: "Guld" },
  { hex: "000000", name: "Sort" },
  { hex: "7A7A7A", name: "Grå" },
  { hex: "FFFFFF", name: "Hvid" },
];
// Danske søgeord -> engelske ikonnavne/tags.
const DANISH = {
  pil: "arrow", pile: "arrow", bruger: "user", person: "user", personer: "users", graf: "chart", diagram: "chart",
  penge: "money", hus: "house", hjem: "house", kalender: "calendar", ur: "clock", tid: "clock", mail: "envelope",
  brev: "envelope", telefon: "phone", søg: "magnifying", lup: "magnifying", indstillinger: "gear", tandhjul: "gear",
  stjerne: "star", hjerte: "heart", lås: "lock", nøgle: "key", fil: "file", mappe: "folder", dokument: "file",
  bil: "car", fly: "airplane", tog: "train", lastbil: "truck", skib: "boat", båd: "boat", verden: "globe", kort: "map",
  lokation: "map-pin", pære: "lightbulb", idé: "lightbulb", ide: "lightbulb", mål: "target", flag: "flag",
  advarsel: "warning", tjek: "check", flueben: "check", kryds: "x", plus: "plus", minus: "minus", info: "info",
  spørgsmål: "question", bog: "book", skole: "graduation", værktøj: "wrench", byg: "hammer", fabrik: "factory",
  energi: "lightning", sol: "sun", vind: "wind", blad: "leaf", træ: "tree", vand: "drop", skraldespand: "trash",
  slet: "trash", kurv: "basket", indkøb: "shopping", butik: "storefront", kontor: "building", bygning: "building",
  sky: "cloud", data: "database", computer: "desktop", skærm: "monitor", kamera: "camera", billede: "image",
  musik: "music", video: "video", hånd: "hand", aftale: "handshake", håndtryk: "handshake", vækst: "trend-up",
  fald: "trend-down", procent: "percent", tal: "number", sikkerhed: "shield", skjold: "shield", team: "users",
  møde: "users", tale: "chat", besked: "chat", chat: "chat", del: "share", download: "download", upload: "upload",
};

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("phosphor." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("phosphor." + k, JSON.stringify(v)); } catch {} },
};

const state = {
  meta: [],                       // [{ n: name, t: tags }]
  data: {},                       // weight -> { name: inner svg }
  weight: store.get("weight", "thin"),
  hex: store.get("hex", "3C2C1C"),
  size: store.get("size", 2),
  query: "",
  hits: [],                       // names in current result order
  selected: null,
  recent: store.get("recent", []),
};

const svg = (inner, attrs = "") => `<svg viewBox="0 0 256 256" fill="currentColor" ${attrs}>${inner}</svg>`;

// ---------- Data ----------
async function loadWeight(w) {
  if (!state.data[w]) state.data[w] = await (await fetch(`icons/${w}.json`)).json();
  return state.data[w];
}

// ---------- Search ----------
function search(query) {
  const terms = query.toLowerCase().trim().split(/\s+/).filter(Boolean)
    .map((t) => [t, DANISH[t]].filter(Boolean));
  if (!terms.length) return state.meta.map((i) => i.n);
  const scored = [];
  for (const { n, t } of state.meta) {
    let score = 0;
    for (const alts of terms) {
      let best = 0;
      for (const a of alts) {
        if (n === a) best = Math.max(best, 100);
        else if (n.startsWith(a)) best = Math.max(best, 60);
        else if (n.includes(a)) best = Math.max(best, 40);
        else if (t.includes(a)) best = Math.max(best, 15);
      }
      if (!best) { score = 0; break; }
      score += best;
    }
    if (score) scored.push([score, n]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].localeCompare(b[1])).map((s) => s[1]);
}

// ---------- Rendering ----------
function cellsHtml(names, icons) {
  return names.map((n) =>
    `<button class="cell${n === state.selected ? " selected" : ""}" data-name="${n}" title="${n}">${svg(icons[n] || "")}</button>`
  ).join("");
}

function renderGrid() {
  const icons = state.data[state.weight];
  if (!icons) return;
  state.hits = search(state.query);
  $("grid").innerHTML = cellsHtml(state.hits, icons);
  $("count").textContent = state.query ? `${state.hits.length} fundet` : `${state.hits.length} ikoner`;
  $("gridTitle").textContent = state.query ? "Resultater" : "Alle ikoner";
  const empty = $("empty");
  empty.hidden = state.hits.length > 0;
  if (!state.hits.length) {
    empty.innerHTML = `${svg(icons["smiley-sad"] || "")}<div>Ingen ikoner matcher “${escapeHtml(state.query)}”.<br>Prøv et engelsk ord.</div>`;
  }
  const recent = state.recent.filter((n) => icons[n]);
  $("recentWrap").hidden = !!state.query || !recent.length;
  $("recent").innerHTML = cellsHtml(recent, icons);
  if (state.query && state.hits.length && !state.hits.includes(state.selected)) select(state.hits[0], false);
}

function renderSelection() {
  document.querySelectorAll(".cell.selected").forEach((c) => c.classList.remove("selected"));
  if (!state.selected) return;
  document.querySelectorAll(`.cell[data-name="${state.selected}"]`).forEach((c) => c.classList.add("selected"));
  const icons = state.data[state.weight];
  $("preview").innerHTML = svg(icons[state.selected] || "");
  $("selName").textContent = state.selected;
  $("selSub").textContent = `${WEIGHT_LABELS[state.weight]} · #${state.hex}`;
  $("insert").disabled = false;
}

function renderWeights() {
  $("weights").innerHTML = WEIGHTS.map((w) =>
    `<button data-w="${w}" aria-pressed="${w === state.weight}">${svg(weightGlyph(w))}${WEIGHT_LABELS[w]}</button>`
  ).join("");
}

// Small "star" glyph per weight for the segmented control; filled in once data is loaded.
const glyphs = {};
function weightGlyph(w) { return glyphs[w] || ""; }
async function loadGlyphs() {
  for (const w of WEIGHTS) {
    const icons = await loadWeight(w);
    glyphs[w] = icons["star"];
  }
  renderWeights();
}

function applyColor() {
  document.body.style.setProperty("--icon-color", "#" + state.hex);
  document.body.classList.toggle("light-icons", luminance(state.hex) > 0.8);
  document.querySelectorAll(".swatch[data-hex]").forEach((s) =>
    s.setAttribute("aria-pressed", s.dataset.hex === state.hex));
  const isCustom = !SWATCHES.some((s) => s.hex === state.hex);
  document.querySelector(".swatch.custom").setAttribute("aria-pressed", isCustom);
  if (document.activeElement !== $("hex")) $("hex").value = state.hex;
  $("picker").value = "#" + state.hex;
  if (state.selected) $("selSub").textContent = `${WEIGHT_LABELS[state.weight]} · #${state.hex}`;
}

function luminance(hex) {
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(hex.substr(i, 2), 16) / 255);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- Actions ----------
function select(name, scroll = true) {
  state.selected = name;
  renderSelection();
  if (scroll) document.querySelector(`#grid .cell[data-name="${name}"]`)?.scrollIntoView({ block: "nearest" });
}

async function setWeight(w) {
  state.weight = w;
  store.set("weight", w);
  renderWeights();
  if (!state.data[w]) $("grid").classList.add("skeleton");
  await loadWeight(w);
  $("grid").classList.remove("skeleton");
  renderGrid();
  renderSelection();
}

function setColor(hex) {
  hex = hex.replace("#", "").toUpperCase();
  if (!/^[0-9A-F]{6}$/.test(hex)) return;
  state.hex = hex;
  store.set("hex", hex);
  applyColor();
}

function setSize(v) {
  v = Math.round(Math.min(30, Math.max(0.2, v)) * 10) / 10;
  if (isNaN(v)) return;
  state.size = v;
  store.set("size", v);
  $("size").value = String(v).replace(".", ",");
}

function iconSvg(name) {
  const pt = state.size * 28.3465;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="${pt}pt" height="${pt}pt" fill="#${state.hex}">${state.data[state.weight][name]}</svg>`;
}

function insert(name = state.selected) {
  if (!name) return;
  const markup = iconSvg(name);
  const pt = state.size * 28.3465;
  const done = (ok, msg) => {
    toast(ok ? `Indsat: ${name}` : msg);
    if (ok) {
      state.recent = [name, ...state.recent.filter((n) => n !== name)].slice(0, 16);
      store.set("recent", state.recent);
      if (!state.query) renderGrid();
    }
  };
  if (window.Office?.context?.document?.setSelectedDataAsync) {
    Office.context.document.setSelectedDataAsync(markup,
      { coercionType: Office.CoercionType.XmlSvg, imageWidth: pt, imageHeight: pt },
      (r) => done(r.status === Office.AsyncResultStatus.Succeeded, "Kunne ikke indsætte: " + (r.error?.message || "ukendt fejl")));
  } else {
    // Uden for PowerPoint (fx ved test i en browser): kopiér SVG'en i stedet.
    navigator.clipboard?.writeText(markup).then(() => done(true), () => done(false, "Åbn panelet i PowerPoint for at indsætte"));
  }
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ---------- Events ----------
function wire() {
  // Swatches
  const colors = $("colors");
  colors.insertAdjacentHTML("afterbegin", SWATCHES.map((s) =>
    `<button class="swatch" data-hex="${s.hex}" title="${s.name} · #${s.hex}" aria-label="${s.name}" style="background:#${s.hex}"></button>`).join(""));
  colors.addEventListener("click", (e) => { const s = e.target.closest(".swatch[data-hex]"); if (s) setColor(s.dataset.hex); });
  $("picker").addEventListener("input", (e) => setColor(e.target.value));
  $("hex").addEventListener("input", (e) => setColor(e.target.value));
  $("hex").addEventListener("blur", () => { $("hex").value = state.hex; });

  $("weights").addEventListener("click", (e) => { const b = e.target.closest("button[data-w]"); if (b) setWeight(b.dataset.w); });

  let raf;
  $("search").addEventListener("input", (e) => {
    state.query = e.target.value;
    $("searchWrap").classList.toggle("has-text", !!state.query);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { renderGrid(); $("scroll").scrollTop = 0; });
  });
  $("clear").addEventListener("click", () => { $("search").value = ""; $("search").dispatchEvent(new Event("input")); $("search").focus(); });

  const onCell = (e) => e.target.closest(".cell");
  $("scroll").addEventListener("click", (e) => { const c = onCell(e); if (c) select(c.dataset.name, false); });
  $("scroll").addEventListener("dblclick", (e) => { const c = onCell(e); if (c) insert(c.dataset.name); });
  $("insert").addEventListener("click", () => insert());

  $("size").addEventListener("change", (e) => setSize(parseFloat(e.target.value.replace(",", "."))));
  $("sizeDown").addEventListener("click", () => setSize(state.size - 0.5));
  $("sizeUp").addEventListener("click", () => setSize(state.size + 0.5));

  // Piletaster flytter markeringen, Enter indsætter, "/" går til søgning.
  document.addEventListener("keydown", (e) => {
    const inField = e.target.matches("input") && e.target !== $("search");
    if (e.key === "/" && !e.target.matches("input")) { e.preventDefault(); $("search").focus(); return; }
    if (inField) return;
    if (e.key === "Enter") { e.preventDefault(); insert(); return; }
    const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols(), ArrowDown: cols() };
    if (!(e.key in moves) || !state.hits.length) return;
    if (e.target === $("search") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
    e.preventDefault();
    const i = Math.max(0, state.hits.indexOf(state.selected));
    select(state.hits[Math.min(state.hits.length - 1, Math.max(0, i + moves[e.key]))]);
  });
}

function cols() {
  const grid = $("grid"), cell = grid.querySelector(".cell");
  return cell ? Math.max(1, Math.round((grid.clientWidth + 6) / (cell.offsetWidth + 6))) : 1;
}

// ---------- Start ----------
async function start() {
  wire();
  renderWeights();
  applyColor();
  setSize(state.size);
  $("grid").classList.add("skeleton");
  $("grid").innerHTML = '<button class="cell"></button>'.repeat(40);
  state.meta = await (await fetch("icons/meta.json")).json();
  await setWeight(WEIGHTS.includes(state.weight) ? state.weight : "thin");
  $("search").focus();
  loadGlyphs();
}

if (window.Office) Office.onReady(start); else start();
</script>
</body>
